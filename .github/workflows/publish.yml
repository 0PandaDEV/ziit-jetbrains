name: Publish Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Resolve plugin archive path
        id: plugin_zip
        run: |
          zip_path=$(find build/distributions -maxdepth 1 -name '*.zip' -type f | head -n 1)
          if [ -z "$zip_path" ]; then
            echo "::error::No plugin ZIP found in build/distributions"
            exit 1
          fi
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Publish to JetBrains Marketplace
        uses: CodingWithCalvin/GHA-JBMarketplacePublisher@HEAD
        with:
          marketplace-pat: ${{ secrets.MARKETPLACE_PAT }}
          plugin-id: 27391
          archive-path: ${{ steps.plugin_zip.outputs.path }}

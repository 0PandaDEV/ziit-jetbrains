name: Publish Plugin

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release
        required: true
      base:
        description: Previous tag or ref to compare from (defaults to the previous tag)
        required: false

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Plugin
        run: ./gradlew buildPlugin

      - name: Resolve plugin archive path
        id: plugin_zip
        run: |
          zip_path=$(find build/distributions -maxdepth 1 -name '*.zip' -type f | head -n 1)
          if [ -z "$zip_path" ]; then
            echo "::error::No plugin ZIP found in build/distributions"
            exit 1
          fi
          echo "path=$zip_path" >> "$GITHUB_OUTPUT"

      - name: Publish to JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::MARKETPLACE_PAT secret is empty or unavailable"
            exit 1
          fi
          ./gradlew publishPlugin --no-configuration-cache

      - name: Changelog
        id: changelog
        uses: 0PandaDEV/changelog@main
        with:
          head: ${{ env.TAG }}
          base: ${{ github.event.inputs.base }}
          step-summary: "true"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NOTES: ${{ steps.changelog.outputs.markdown }}
          ZIP: ${{ steps.plugin_zip.outputs.path }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$NOTES" "${flags[@]}"
            gh release upload "$TAG" "$ZIP" --clobber
          else
            gh release create "$TAG" "$ZIP" --verify-tag --title "$TAG" --notes "$NOTES" "${flags[@]}"
          fi
